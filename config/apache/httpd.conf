Alias /bitnami/ "/opt/lampp/apache2/htdocs/"
Alias /bitnami "/opt/lampp/apache2/htdocs"

<Directory "/opt/lampp/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride All
    Order allow,deny
    Allow from all
</Directory>
NameVirtualHost *:80

<VirtualHost *:80>
    ServerName ceribouchetiflor.be

    ProxyPreserveHost On
    ProxyPass /dashboard http://127.0.0.1:8080/page
    ProxyPassReverse /dashboard http://127.0.0.1:8080/page
    ProxyPass /values http://127.0.1:8080/values
    ProxyPassReverse /values http://127.0.1:8080/values
    ProxyPass /resource http://127.0.0.1:8080/resource
    ProxyPassReverse /resource http://127.0.0.1:8080/resource
    ProxyPass /page http://127.0.0.1:8080/page 
    ProxyPassReverse /page http://127.0.0.1:8080/page
    ProxyPass /page/ontology http://127.0.0.1:80/ontology
    ProxyPassReverse /page/ontology http://127.0.0.1:80/ontology
    ProxyPass /data http://127.0.0.1:8080/data
    ProxyPassReverse /data http://127.0.0.1:8080/data
	 ProxyPass /static http://127.0.0.1:8080/static
    ProxyPassReverse /static http://127.0.0.1:8080/static

</VirtualHost>

<VirtualHost *:80>
    ServerName endpoint.ceribouchetiflor.be

    ProxyPreserveHost On
    
    ProxyPass / http://127.0.0.1:6942/
    ProxyPassReverse / http://127.0.0.1:6942/
</VirtualHost>

<VirtualHost *:80>
    ServerName faceted.ceribouchetiflor.be
    
    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:8890/
    ProxyPassReverse / http://127.0.0.1:8890/
</VirtualHost>
<IfModule mod_headers.c>
  Header set Access-Control-Allow-Origin "*"
  Header set Access-Control-Allow-Methods "GET, OPTIONS"
  Header set Access-Control-Allow-Headers "Accept, Content-Type"
</IfModule>